version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: gainora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gainora
      POSTGRES_PASSWORD: gainora_dev
      POSTGRES_DB: gainora_dev
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
